[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pygit-pygit"
version = "1.0.0"
description = "Mini implementación de Git en Python puro, como proyecto de aprendizaje"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Reverse" }]
keywords = ["git", "learning", "version-control"]

[project.scripts]
pygit = "pygit:main"

[tool.setuptools]
py-modules = ["pygit"]

[tool.pytest.ini_options]
testpaths = ["."]
